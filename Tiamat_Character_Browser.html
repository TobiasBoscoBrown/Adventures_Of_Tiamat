<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tiamat Campaign — Character Browser</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@300;400;500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #06061a;
    color: #dce0f0;
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    background: linear-gradient(135deg, #0a0a20 0%, #12103a 100%);
    border-bottom: 2px solid #c9a227;
    padding: 24px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  header h1 {
    font-family: 'Cinzel', serif;
    font-size: 28px;
    color: #c9a227;
    letter-spacing: 2px;
  }
  header h1 span { color: #9b6dff; }
  .header-stats {
    display: flex;
    gap: 24px;
    align-items: center;
  }
  .stat-badge {
    background: #0e0e24;
    border: 1px solid #333;
    border-radius: 20px;
    padding: 6px 16px;
    font-size: 13px;
    color: #9098b8;
  }
  .stat-badge strong { color: #c9a227; }

  /* ── Search & Filter Bar ── */
  .toolbar {
    background: #0a0a1e;
    padding: 16px 40px;
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
    border-bottom: 1px solid #1e2040;
  }
  .search-box {
    background: #0e0e28;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 10px 16px;
    color: #dce0f0;
    font-size: 14px;
    width: 300px;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-box:focus { border-color: #c9a227; }
  .search-box::placeholder { color: #4a5272; }

  .filter-btn {
    background: #0e0e28;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 8px 16px;
    color: #9098b8;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Inter', sans-serif;
  }
  .filter-btn:hover { border-color: #c9a227; color: #c9a227; }
  .filter-btn.active {
    background: #c9a227;
    color: #06061a;
    border-color: #c9a227;
    font-weight: 600;
  }
  .filter-btn.theme-royal.active { background: #c9a227; }
  .filter-btn.theme-warrior.active { background: #cc3333; color: #fff; border-color: #cc3333; }
  .filter-btn.theme-arcane.active { background: #4488ff; color: #fff; border-color: #4488ff; }
  .filter-btn.theme-nature.active { background: #44aa44; color: #fff; border-color: #44aa44; }
  .filter-btn.theme-shadow.active { background: #8844bb; color: #fff; border-color: #8844bb; }
  .filter-btn.theme-fire.active { background: #dd6622; color: #fff; border-color: #dd6622; }
  .filter-btn.theme-ocean.active { background: #2299bb; color: #fff; border-color: #2299bb; }
  .filter-btn.theme-stone.active { background: #aa8855; color: #fff; border-color: #aa8855; }
  .filter-btn.theme-orc.active { background: #88aa22; color: #fff; border-color: #88aa22; }
  .filter-btn.theme-pink.active { background: #dd4488; color: #fff; border-color: #dd4488; }

  /* ── Grid ── */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
    padding: 30px 40px;
  }

  /* ── Card ── */
  .card {
    background: linear-gradient(145deg, #0e0e24 0%, #0a0a1a 100%);
    border: 1px solid #1e2040;
    border-radius: 12px;
    overflow: visible;
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
  }
  .card:hover {
    transform: translateY(-4px);
    border-color: var(--accent, #c9a227);
    box-shadow: 0 8px 30px rgba(0,0,0,0.5), 0 0 20px var(--glow, rgba(201,162,39,0.15));
  }
  .card:hover .card-tooltip { opacity: 1; visibility: visible; transform: translateY(0); pointer-events: auto; }
  .card-inner {
    border-radius: 12px;
    overflow: hidden;
  }
  .card-tooltip {
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%) translateY(8px);
    width: 340px;
    max-width: 90vw;
    background: #12103a;
    border: 1px solid var(--accent, #c9a227);
    border-radius: 10px;
    padding: 14px 16px;
    z-index: 150;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.2s, transform 0.2s, visibility 0.2s;
    pointer-events: none;
    box-shadow: 0 8px 30px rgba(0,0,0,0.7);
    margin-bottom: 10px;
  }
  .card-tooltip::after {
    content: '';
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    border: 8px solid transparent;
    border-top-color: var(--accent, #c9a227);
  }
  .tt-name { font-family: 'Cinzel', serif; font-size: 15px; color: #f0e6d3; font-weight: 700; margin-bottom: 2px; }
  .tt-title { font-size: 11px; color: var(--accent, #c9a227); margin-bottom: 8px; }
  .tt-stats { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
  .tt-stat { background: #06061a; border: 1px solid #1e2040; border-radius: 5px; padding: 3px 7px; font-size: 10px; color: #9098b8; }
  .tt-stat strong { color: var(--accent, #c9a227); }
  .tt-abilities { display: flex; gap: 4px; margin-bottom: 8px; }
  .tt-ab { text-align: center; font-size: 10px; color: #9098b8; flex: 1; }
  .tt-ab span { display: block; font-size: 14px; font-weight: 700; color: #f0e6d3; }
  .tt-ab.hl span { color: var(--accent, #c9a227); }
  .tt-lore { font-size: 11px; color: #7a82a0; font-style: italic; line-height: 1.4; }
  .card-accent {
    height: 4px;
    background: var(--accent, #c9a227);
  }
  .card-body { padding: 20px; }
  .card-name {
    font-family: 'Cinzel', serif;
    font-size: 20px;
    font-weight: 700;
    color: #f0e6d3;
    margin-bottom: 4px;
  }
  .card-title {
    font-size: 12px;
    color: var(--accent, #c9a227);
    font-weight: 500;
    margin-bottom: 10px;
    letter-spacing: 0.5px;
  }
  .card-subtitle {
    font-size: 11px;
    color: #4a5272;
    margin-bottom: 12px;
    line-height: 1.4;
  }
  .card-stats {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .mini-stat {
    background: #06061a;
    border: 1px solid #1e2040;
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 11px;
    color: #9098b8;
  }
  .mini-stat strong { color: var(--accent, #c9a227); }
  .card-quote {
    font-size: 12px;
    font-style: italic;
    color: var(--accent, #c9a227);
    opacity: 0.8;
    line-height: 1.5;
    border-left: 2px solid var(--accent, #c9a227);
    padding-left: 10px;
  }
  .card-group {
    position: absolute;
    top: 14px;
    right: 14px;
    background: rgba(6,6,26,0.8);
    border: 1px solid #333;
    border-radius: 12px;
    padding: 3px 10px;
    font-size: 10px;
    color: #9098b8;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  /* ── HP Tracker ── */
  .hp-tracker {
    padding: 10px 16px 14px;
    background: rgba(6,6,26,0.6);
    border-top: 1px solid #1e2040;
    cursor: default;
  }
  .hp-bar-wrap {
    background: #06061a;
    border: 1px solid #1a1a38;
    border-radius: 4px;
    height: 7px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .hp-bar {
    height: 100%;
    border-radius: 4px;
    transition: width 0.35s ease, background-color 0.35s ease;
  }
  .hp-bar.hp-healthy  { background: linear-gradient(90deg, #33bb44, #44dd55); }
  .hp-bar.hp-wounded  { background: linear-gradient(90deg, #cc8811, #ffaa22); }
  .hp-bar.hp-critical { background: linear-gradient(90deg, #aa1111, #dd3333); }
  .hp-bar.hp-dead     { background: #330000; width: 100% !important; }
  .hp-controls {
    display: flex;
    align-items: center;
    gap: 5px;
    justify-content: center;
  }
  .hp-btn {
    background: #0e0e28;
    border: 1px solid #2a2a50;
    border-radius: 5px;
    color: #7a82a0;
    font-size: 11px;
    padding: 3px 7px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: all 0.15s;
    line-height: 1.4;
    user-select: none;
  }
  .hp-btn-minus:hover { border-color: #cc3333; color: #cc3333; background: rgba(204,51,51,0.1); }
  .hp-btn-plus:hover  { border-color: #44aa44; color: #44aa44; background: rgba(68,170,68,0.1); }
  .hp-display {
    font-size: 12px;
    color: #dce0f0;
    min-width: 68px;
    text-align: center;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  .hp-sep { color: #4a5272; margin: 0 2px; font-weight: 400; }
  .hp-cur { color: var(--accent, #c9a227); }
  .card.is-dead { opacity: 0.55; filter: grayscale(0.6); }
  .dead-stamp {
    position: absolute;
    top: 45%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(-12deg);
    font-family: 'Cinzel', serif;
    font-size: 26px;
    color: #cc3333;
    font-weight: 900;
    text-shadow: 0 0 18px rgba(204,51,51,0.7);
    pointer-events: none;
    z-index: 6;
    letter-spacing: 4px;
    border: 3px solid #cc3333;
    padding: 4px 12px;
    border-radius: 4px;
    opacity: 0.85;
  }
  .reset-hp-btn {
    background: #0e0e28;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 8px 14px;
    color: #7a82a0;
    font-size: 12px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: all 0.2s;
  }
  .reset-hp-btn:hover { border-color: #cc3333; color: #cc3333; }

  /* ── Modal ── */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.85);
    z-index: 200;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: #0a0a1e;
    border: 1px solid #333;
    border-radius: 16px;
    max-width: 95vw;
    width: 100%;
    max-height: 95vh;
    overflow: hidden;
    position: relative;
  }
  .modal-header {
    padding: 24px 28px;
    border-bottom: 1px solid #1e2040;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    background: #0a0a1e;
    z-index: 10;
    border-radius: 16px 16px 0 0;
  }
  .modal-header h2 {
    font-family: 'Cinzel', serif;
    color: #f0e6d3;
    font-size: 24px;
  }
  .modal-close {
    background: none;
    border: 1px solid #333;
    color: #9098b8;
    border-radius: 8px;
    padding: 8px 14px;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.2s;
  }
  .modal-close:hover { border-color: #cc3333; color: #cc3333; }
  .modal-nav {
    display: flex;
    gap: 8px;
  }
  .modal-nav button {
    background: #0e0e28;
    border: 1px solid #333;
    color: #c9a227;
    border-radius: 8px;
    padding: 8px 16px;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.2s;
  }
  .modal-nav button:hover { background: #c9a227; color: #06061a; }
  .modal-body { padding: 24px 28px; }
  .modal-section {
    margin-bottom: 20px;
  }
  .modal-section h3 {
    font-family: 'Cinzel', serif;
    font-size: 14px;
    color: var(--accent, #c9a227);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid #1e2040;
  }
  .ability-row {
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .ability-chip {
    background: #0e0e28;
    border: 1px solid #1e2040;
    border-radius: 8px;
    padding: 8px 12px;
    text-align: center;
    min-width: 70px;
  }
  .ability-chip.highlight { border-color: var(--accent, #c9a227); }
  .ability-chip .ab-name { font-size: 10px; color: #9098b8; display: block; }
  .ability-chip .ab-score { font-size: 20px; font-weight: 700; color: #f0e6d3; display: block; }
  .ability-chip .ab-mod { font-size: 12px; color: var(--accent, #c9a227); display: block; }
  .trait-item {
    margin-bottom: 8px;
    font-size: 13px;
    line-height: 1.5;
    color: #b8c0d8;
  }
  .trait-item strong { color: #f0e6d3; }
  .modal-quote {
    font-size: 16px;
    font-style: italic;
    color: var(--accent, #c9a227);
    text-align: center;
    padding: 16px;
    margin-bottom: 16px;
    border: 1px solid #1e2040;
    border-radius: 8px;
    background: #06061a;
  }
  .modal-lore {
    font-size: 13px;
    line-height: 1.7;
    color: #9098b8;
    font-style: italic;
  }
  .stat-line {
    font-size: 13px;
    margin-bottom: 4px;
    color: #b8c0d8;
  }
  .stat-line strong { color: var(--accent, #c9a227); }

  .keyboard-hint {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #0e0e28;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 11px;
    color: #4a5272;
    z-index: 50;
  }
  .keyboard-hint kbd {
    background: #1e2040;
    border: 1px solid #333;
    border-radius: 4px;
    padding: 2px 6px;
    font-size: 11px;
    color: #9098b8;
    font-family: monospace;
  }

  /* ── (tabs removed — modal goes straight to PDF) ── */
  .pdf-container {
    width: 100%;
    height: calc(95vh - 70px);
    border: none;
    background: #111;
    border-radius: 0 0 16px 16px;
  }
  .pdf-missing {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 300px;
    color: #4a5272;
    font-size: 14px;
    font-style: italic;
  }
</style>
</head>
<body>

<header>
  <h1>ADVENTURES OF <span>TIAMAT</span> — Character Browser</h1>
  <div class="header-stats">
    <div class="stat-badge"><strong id="totalCount">0</strong> Characters</div>
    <div class="stat-badge"><strong id="visibleCount">0</strong> Showing</div>
  </div>
</header>

<div class="toolbar">
  <input type="text" class="search-box" id="searchBox" placeholder="Search characters by name, title, or lore..." autofocus>
  <button class="filter-btn active" data-group="all" onclick="filterGroup('all', this)">All</button>
  <button class="filter-btn" data-group="royals" onclick="filterGroup('royals', this)">Royals</button>
  <button class="filter-btn" data-group="power" onclick="filterGroup('power', this)">Power Players</button>
  <button class="filter-btn" data-group="colorful" onclick="filterGroup('colorful', this)">Colorful NPCs</button>
  <button class="filter-btn" data-group="kubi" onclick="filterGroup('kubi', this)">Kubi Conspiracy</button>
  <button class="filter-btn" data-group="gondor" onclick="filterGroup('gondor', this)">Gondor</button>
  <button class="filter-btn" data-group="misc" onclick="filterGroup('misc', this)">Misc</button>
  <span style="color: #333; margin: 0 4px;">|</span>
  <button class="filter-btn theme-royal" data-theme="royal" onclick="filterTheme('royal', this)">Royal</button>
  <button class="filter-btn theme-warrior" data-theme="warrior" onclick="filterTheme('warrior', this)">Warrior</button>
  <button class="filter-btn theme-arcane" data-theme="arcane" onclick="filterTheme('arcane', this)">Arcane</button>
  <button class="filter-btn theme-shadow" data-theme="shadow" onclick="filterTheme('shadow', this)">Shadow</button>
  <button class="filter-btn theme-nature" data-theme="nature" onclick="filterTheme('nature', this)">Nature</button>
  <button class="filter-btn theme-fire" data-theme="fire" onclick="filterTheme('fire', this)">Fire</button>
  <button class="filter-btn theme-ocean" data-theme="ocean" onclick="filterTheme('ocean', this)">Ocean</button>
  <button class="filter-btn theme-orc" data-theme="orc" onclick="filterTheme('orc', this)">Orc</button>
  <button class="filter-btn theme-stone" data-theme="stone" onclick="filterTheme('stone', this)">Stone</button>
  <button class="filter-btn theme-pink" data-theme="pink" onclick="filterTheme('pink', this)">Pink</button>
  <span style="color: #333; margin: 0 4px;">|</span>
  <button class="reset-hp-btn" onclick="resetAllHP()" title="Reset all HP to maximum">⚕ Reset All HP</button>
</div>

<div class="grid" id="grid"></div>

<div class="modal-overlay" id="modal">
  <div class="modal" id="modalContent">
    <div class="modal-header">
      <h2 id="modalName"></h2>
      <div style="display:flex;gap:8px;align-items:center;">
        <div class="modal-nav">
          <button onclick="navChar(-1)">&#9664; Prev</button>
          <button onclick="navChar(1)">Next &#9654;</button>
        </div>
        <button class="modal-close" onclick="closeModal()">&#10005; Close</button>
      </div>
    </div>
    <div id="modalPdf" style="padding: 0;"></div>
  </div>
</div>

<div class="keyboard-hint">
  <kbd>&#8592;</kbd> <kbd>&#8594;</kbd> Navigate &nbsp; <kbd>Esc</kbd> Close &nbsp; <kbd>/</kbd> Search
</div>

<script>
const THEMES = {
  royal:   { accent: '#c9a227', glow: 'rgba(201,162,39,0.2)' },
  warrior: { accent: '#cc3333', glow: 'rgba(204,51,51,0.2)' },
  arcane:  { accent: '#4488ff', glow: 'rgba(68,136,255,0.2)' },
  nature:  { accent: '#44aa44', glow: 'rgba(68,170,68,0.2)' },
  shadow:  { accent: '#8844bb', glow: 'rgba(136,68,187,0.2)' },
  fire:    { accent: '#dd6622', glow: 'rgba(221,102,34,0.2)' },
  ocean:   { accent: '#2299bb', glow: 'rgba(34,153,187,0.2)' },
  stone:   { accent: '#aa8855', glow: 'rgba(170,136,85,0.2)' },
  orc:     { accent: '#88aa22', glow: 'rgba(136,170,34,0.2)' },
  pink:    { accent: '#dd4488', glow: 'rgba(221,68,136,0.2)' },
};

const CHARS = [
  // ROYALS
  { name:"Othorian Nel", title:"King · High Elf · Ancient Ruler", subtitle:"Born 10 B.T. · Age ~6,000 · Lawful Neutral", theme:"royal", group:"royals", cr:"21", hp:"285", ac:"20", quote:"I have watched empires rise and crumble. I will not let this one fall.", abilities:[["STR",18,"+4",0],["DEX",20,"+5",1],["CON",20,"+5",0],["INT",18,"+4",1],["WIS",22,"+6",1],["CHA",20,"+5",1]], traits:["Legendary Resistance (3/Day)","Ageless — cannot age","Tiamat's Secret — knows the reincarnation cycle","Elven Perfection — immune to charm/sleep","Battle-Hardened Commander — allies +2 attacks/saves within 30 ft."], lore:"The oldest living elf, born before the calendar. Has ruled for millennia, fought Jarnath multiple times, destroyed the town of Nether. Carries the terrible secret of Tiamat's reincarnation." },
  { name:"Charles Rex", title:"King · Human · Co-Ruler", subtitle:"Born 5948 A.T. · Secretly Being Poisoned · Lawful Good", theme:"royal", group:"royals", cr:"12", hp:"136", ac:"18", quote:"A king who cannot protect his family cannot protect his kingdom.", abilities:[["STR",18,"+4",1],["DEX",12,"+1",0],["CON",18,"+4",1],["INT",14,"+2",0],["WIS",16,"+3",1],["CHA",18,"+4",1]], traits:["Poisoned King — secretly being poisoned by Barfolomew","Beloved Ruler — advantage on Persuasion with citizens","Iron Will — advantage vs. fear/charm","Warrior King — still trains daily despite illness"], lore:"Rules alongside Othorian in an unprecedented alliance. A good man, loving father, slowly dying from poison he doesn't know about." },
  { name:"Marta Rex", title:"Queen · High Cleric · Healer", subtitle:"Born 5956 A.T. · Devoted Wife & Mother · Lawful Good", theme:"pink", group:"royals", cr:"9", hp:"102", ac:"16", quote:"Healing is not just mending flesh. It is mending hope.", abilities:[["STR",10,"+0",0],["DEX",12,"+1",0],["CON",16,"+3",0],["INT",14,"+2",0],["WIS",20,"+5",1],["CHA",18,"+4",1]], traits:["Divine Healer — max healing + damage resistance","Mother's Intuition — senses something wrong with Charles","Beacon of Hope — allies advantage on death saves"], lore:"The beating heart of the royal family. Channels divine magic into Charles daily, fighting an enemy she cannot see." },
  { name:"Amare Rex", title:"Princess · Cleric Apprentice", subtitle:"Born 5988 A.T. · Young & Rebellious · Neutral Good", theme:"pink", group:"royals", cr:"3", hp:"45", ac:"14", quote:"I don't want to be queen. I want to be useful.", abilities:[["STR",10,"+0",0],["DEX",14,"+2",0],["CON",14,"+2",0],["INT",13,"+1",0],["WIS",16,"+3",1],["CHA",16,"+3",1]], traits:["Emerging Gift — can upcast healing once/day","Rebellious Spirit — advantage vs. command","Father's Daughter — reactive healing when ally drops"], lore:"Youngest Rex child, following her mother's path. Headstrong, sharp-tongued, secretly terrified of losing her father." },

  { name:"Kassandra", title:"Mayor of Cardious · Warrior", subtitle:"Born 5970 A.T. · Badass Fighter · Chaotic Good", theme:"warrior", group:"colorful", cr:"10", hp:"142", ac:"18", quote:"You want to arm wrestle? I've never lost. But you're welcome to try.", abilities:[["STR",20,"+5",1],["DEX",16,"+3",1],["CON",18,"+4",1],["INT",12,"+1",0],["WIS",14,"+2",0],["CHA",18,"+4",1]], traits:["Dragon Trainer — trains with dragons","Arm Wrestling Champion — undefeated","Fearless Leader — immune to fear","Think Gina Carano"], lore:"Toughest human in the realm. Trains with dragons for fun, never lost an arm wrestle, and has slept with Jarnath." },
  { name:"Maurice", title:"Architect of Gondor · Eccentric Genius", subtitle:"Born 5950 A.T. · Hears Dragons in Sewers · CN", theme:"stone", group:"colorful", cr:"2", hp:"52", ac:"12", quote:"I'm telling you, there's a dragon in the pipes! And WHERE ARE MY SOCKS?!", abilities:[["STR",14,"+2",0],["DEX",10,"+0",0],["CON",14,"+2",0],["INT",20,"+5",1],["WIS",8,"-1",0],["CHA",12,"+1",0]], traits:["Master Architect — built Gondor's sewer system","Hears Dragons in the Sewers — might actually be right","Rats Steal His Socks","Brilliant but Unhinged"], lore:"Greatest architect Gondor has produced and also the craziest. Claims to hear dragons in the pipes — and King Hardfire IS raising one down there..." },

  { name:"Joe", title:"Crabshack Owner · Helne", subtitle:"He Owns the Crabshack · True Neutral", theme:"ocean", group:"misc", cr:"0", hp:"18", ac:"10", quote:"You want crab? I got crab. Sit down.", abilities:[["STR",12,"+1",0],["DEX",10,"+0",0],["CON",12,"+1",0],["INT",10,"+0",0],["WIS",12,"+1",1],["CHA",14,"+2",1]], traits:["Joe Owns the Crabshack","Best Crab in Town — 1d4 temp HP","Knows Everyone — gossip advantage"], lore:"Joe owns the crabshack. That's it. Good crab though." },

  { name:"Djoner", title:"Sorcerer 20 · Graviturgist", subtitle:"Dragon Tamer · Lawful Neutral · Gravity Sorceress", theme:"arcane", group:"power", cr:"20", hp:"150", ac:"18", quote:"I do not destroy what I can control. And I do not trust what I cannot.", abilities:[["STR",10,"+0",0],["DEX",16,"+3",0],["CON",16,"+3",0],["INT",18,"+4",1],["WIS",18,"+4",1],["CHA",24,"+7",1]], traits:["Metamagic (4 options)","Font of Magic — 20 SP","Gravity Well","Dragon Tamer's Presence"], lore:"Space parts for her. The room tightens when she is angry. Her eyes hold tiny black holes." },
  { name:"Rigod", title:"Black Dragon Demigod of Chaos", subtitle:"Gargantuan Dragon · Chaotic Evil · CR 30", theme:"fire", group:"power", cr:"30", hp:"735", ac:"26", quote:"I seek dissolution — the unraveling of order itself.", abilities:[["STR",30,"+10",1],["DEX",16,"+3",0],["CON",28,"+9",1],["INT",22,"+6",0],["WIS",20,"+5",0],["CHA",26,"+8",1]], traits:["Legendary Resistance (5/Day)","Divine Aura of Entropy","Acidic Blood","Magic Resistance","Chaos Engine","Apotheosis of Entropy (Mythic)"], lore:"Transcended mortality through centuries of hoarding chaotic energy. Plasma breath cuts through castle walls." },
];

// Remove duplicate Maurice
const seen = new Set();
const UNIQUE_CHARS = CHARS.filter(c => {
  const key = c.name + c.group;
  if (c.lore && c.lore.includes('Listed under')) return false;
  if (seen.has(c.name)) return false;
  seen.add(c.name);
  return true;
});

let currentFilter = 'all';
let currentTheme = null;
let currentSearch = '';
let currentModalIdx = -1;
let filteredChars = [...UNIQUE_CHARS];

function getTheme(t) { return THEMES[t] || THEMES.royal; }

/* ── HP Tracker ── */
function hpKey(name) { return 'tiamat_hp_' + name.replace(/[^a-zA-Z0-9]/g, '_'); }
function safeId(name) { return name.replace(/[^a-zA-Z0-9]/g, '_'); }

function getHP(name, maxHp) {
  const stored = localStorage.getItem(hpKey(name));
  return stored !== null ? parseInt(stored) : parseInt(maxHp) || 0;
}

function hpClass(pct) {
  if (pct > 50) return 'hp-healthy';
  if (pct > 25) return 'hp-wounded';
  if (pct > 0)  return 'hp-critical';
  return 'hp-dead';
}

function setHP(name, val, maxHp) {
  const max = parseInt(maxHp) || 0;
  val = Math.max(0, Math.min(max, val));
  localStorage.setItem(hpKey(name), val);
  const sid = safeId(name);
  const pct = max > 0 ? (val / max) * 100 : 0;
  const bar  = document.getElementById('hpbar-' + sid);
  const cur  = document.getElementById('hpcur-' + sid);
  const card = document.getElementById('card-' + sid);
  const stamp = document.getElementById('dead-' + sid);
  if (bar)  { bar.style.width = pct + '%'; bar.className = 'hp-bar ' + hpClass(pct); }
  if (cur)  { cur.textContent = val; }
  if (card) { card.classList.toggle('is-dead', val === 0); }
  if (stamp) { stamp.style.display = val === 0 ? 'block' : 'none'; }
}

function adjustHP(name, delta, maxHp, event) {
  event.stopPropagation();
  setHP(name, getHP(name, maxHp) + delta, maxHp);
}

function resetAllHP() {
  if (!confirm('Reset all character HP to maximum?')) return;
  UNIQUE_CHARS.forEach(c => localStorage.removeItem(hpKey(c.name)));
  renderGrid();
}

function renderGrid() {
  filteredChars = UNIQUE_CHARS.filter(c => {
    const matchGroup = currentFilter === 'all' || c.group === currentFilter;
    const matchTheme = !currentTheme || c.theme === currentTheme;
    const matchSearch = !currentSearch ||
      c.name.toLowerCase().includes(currentSearch) ||
      c.title.toLowerCase().includes(currentSearch) ||
      (c.lore && c.lore.toLowerCase().includes(currentSearch)) ||
      (c.quote && c.quote.toLowerCase().includes(currentSearch));
    return matchGroup && matchTheme && matchSearch;
  });

  const grid = document.getElementById('grid');
  grid.innerHTML = filteredChars.map((c, i) => {
    const t = getTheme(c.theme);
    const sid = safeId(c.name);
    const maxHp = parseInt(c.hp) || 0;
    const curHp = getHP(c.name, maxHp);
    const pct   = maxHp > 0 ? (curHp / maxHp) * 100 : 0;
    const isDead = curHp === 0;
    const abHtml = c.abilities.map(([n,s,m,hl]) =>
      `<div class="tt-ab${hl?' hl':''}"><span>${s}</span>${n}</div>`
    ).join('');
    const traitHtml = (c.traits||[]).slice(0,4).map(tr => `<div style="font-size:10px;color:#b8c0d8;margin-bottom:2px;">• ${tr}</div>`).join('');
    const loreSnip = c.lore ? (c.lore.length > 120 ? c.lore.slice(0,120) + '…' : c.lore) : '';
    return `<div class="card${isDead?' is-dead':''}" id="card-${sid}" style="--accent:${t.accent};--glow:${t.glow}" onclick="openModal(${i})">
      ${isDead ? `<div class="dead-stamp" id="dead-${sid}">DEAD</div>` : `<div class="dead-stamp" id="dead-${sid}" style="display:none">DEAD</div>`}
      <div class="card-tooltip" style="--accent:${t.accent}">
        <div class="tt-name">${c.name}</div>
        <div class="tt-title">${c.title}</div>
        <div class="tt-stats">
          <div class="tt-stat"><strong>CR</strong> ${c.cr}</div>
          <div class="tt-stat"><strong>HP</strong> ${c.hp}</div>
          <div class="tt-stat"><strong>AC</strong> ${c.ac}</div>
        </div>
        <div class="tt-abilities">${abHtml}</div>
        ${traitHtml}
        ${loreSnip ? `<div class="tt-lore">${loreSnip}</div>` : ''}
      </div>
      <div class="card-inner">
        <div class="card-accent"></div>
        <div class="card-body">
          <div class="card-group">${c.group}</div>
          <div class="card-name">${c.name}</div>
          <div class="card-title">${c.title}</div>
          <div class="card-subtitle">${c.subtitle}</div>
          <div class="card-stats">
            <div class="mini-stat"><strong>CR</strong> ${c.cr}</div>
            <div class="mini-stat"><strong>AC</strong> ${c.ac}</div>
          </div>
          ${c.quote ? `<div class="card-quote">"${c.quote}"</div>` : ''}
        </div>
        <div class="hp-tracker" onclick="event.stopPropagation()">
          <div class="hp-bar-wrap">
            <div class="hp-bar ${hpClass(pct)}" id="hpbar-${sid}" style="width:${pct}%"></div>
          </div>
          <div class="hp-controls">
            <button class="hp-btn hp-btn-minus" onclick="adjustHP('${c.name}',  -10, '${c.hp}', event)" title="−10 HP">−10</button>
            <button class="hp-btn hp-btn-minus" onclick="adjustHP('${c.name}',   -1, '${c.hp}', event)" title="−1 HP">−1</button>
            <span class="hp-display"><span class="hp-cur" id="hpcur-${sid}">${curHp}</span><span class="hp-sep"> / </span>${c.hp}</span>
            <button class="hp-btn hp-btn-plus"  onclick="adjustHP('${c.name}',   +1, '${c.hp}', event)" title="+1 HP">+1</button>
            <button class="hp-btn hp-btn-plus"  onclick="adjustHP('${c.name}',  +10, '${c.hp}', event)" title="+10 HP">+10</button>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');

  document.getElementById('totalCount').textContent = UNIQUE_CHARS.length;
  document.getElementById('visibleCount').textContent = filteredChars.length;
}

function filterGroup(group, btn) {
  currentFilter = group;
  currentTheme = null;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderGrid();
}

function filterTheme(theme, btn) {
  currentFilter = 'all';
  if (currentTheme === theme) {
    currentTheme = null;
    btn.classList.remove('active');
  } else {
    currentTheme = theme;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }
  document.querySelector('[data-group="all"]').classList.toggle('active', !currentTheme);
  renderGrid();
}

function openModal(idx) {
  currentModalIdx = idx;
  const c = filteredChars[idx];
  const t = getTheme(c.theme);
  document.getElementById('modalName').textContent = c.name;
  document.getElementById('modalContent').style.setProperty('--accent', t.accent);

  // Build PDF filename from character name and embed it
  const pdfName = c.name.replace(/\s+/g, '_') + '_Character_Sheet.pdf';
  const pdfEl = document.getElementById('modalPdf');
  pdfEl.innerHTML = `<iframe class="pdf-container" src="${pdfName}"></iframe>`;

  document.getElementById('modal').classList.add('open');
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  currentModalIdx = -1;
}

function navChar(dir) {
  if (currentModalIdx < 0) return;
  let next = currentModalIdx + dir;
  if (next < 0) next = filteredChars.length - 1;
  if (next >= filteredChars.length) next = 0;
  openModal(next);
}

document.getElementById('searchBox').addEventListener('input', (e) => {
  currentSearch = e.target.value.toLowerCase().trim();
  renderGrid();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
  if (e.key === 'ArrowLeft' && currentModalIdx >= 0) navChar(-1);
  if (e.key === 'ArrowRight' && currentModalIdx >= 0) navChar(1);
  if (e.key === '/' && currentModalIdx < 0 && document.activeElement !== document.getElementById('searchBox')) {
    e.preventDefault();
    document.getElementById('searchBox').focus();
  }
});

document.getElementById('modal').addEventListener('click', (e) => {
  if (e.target === document.getElementById('modal')) closeModal();
});

renderGrid();
</script>
</body>
</html>
