<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tiamat Campaign — Character Browser</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@300;400;500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #06061a;
    color: #dce0f0;
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    background: linear-gradient(135deg, #0a0a20 0%, #12103a 100%);
    border-bottom: 2px solid #c9a227;
    padding: 24px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  header h1 {
    font-family: 'Cinzel', serif;
    font-size: 28px;
    color: #c9a227;
    letter-spacing: 2px;
  }
  header h1 span { color: #9b6dff; }
  .header-stats {
    display: flex;
    gap: 24px;
    align-items: center;
  }
  .stat-badge {
    background: #0e0e24;
    border: 1px solid #333;
    border-radius: 20px;
    padding: 6px 16px;
    font-size: 13px;
    color: #9098b8;
  }
  .stat-badge strong { color: #c9a227; }

  /* ── Search & Filter Bar ── */
  .toolbar {
    background: #0a0a1e;
    padding: 16px 40px;
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
    border-bottom: 1px solid #1e2040;
  }
  .search-box {
    background: #0e0e28;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 10px 16px;
    color: #dce0f0;
    font-size: 14px;
    width: 300px;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-box:focus { border-color: #c9a227; }
  .search-box::placeholder { color: #4a5272; }

  .filter-btn {
    background: #0e0e28;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 8px 16px;
    color: #9098b8;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Inter', sans-serif;
  }
  .filter-btn:hover { border-color: #c9a227; color: #c9a227; }
  .filter-btn.active {
    background: #c9a227;
    color: #06061a;
    border-color: #c9a227;
    font-weight: 600;
  }
  .filter-btn.theme-royal.active { background: #c9a227; }
  .filter-btn.theme-warrior.active { background: #cc3333; color: #fff; border-color: #cc3333; }
  .filter-btn.theme-arcane.active { background: #4488ff; color: #fff; border-color: #4488ff; }
  .filter-btn.theme-nature.active { background: #44aa44; color: #fff; border-color: #44aa44; }
  .filter-btn.theme-shadow.active { background: #8844bb; color: #fff; border-color: #8844bb; }
  .filter-btn.theme-fire.active { background: #dd6622; color: #fff; border-color: #dd6622; }
  .filter-btn.theme-ocean.active { background: #2299bb; color: #fff; border-color: #2299bb; }
  .filter-btn.theme-stone.active { background: #aa8855; color: #fff; border-color: #aa8855; }
  .filter-btn.theme-orc.active { background: #88aa22; color: #fff; border-color: #88aa22; }
  .filter-btn.theme-pink.active { background: #dd4488; color: #fff; border-color: #dd4488; }

  /* ── Grid ── */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
    padding: 30px 40px;
  }

  /* ── Card ── */
  .card {
    background: linear-gradient(145deg, #0e0e24 0%, #0a0a1a 100%);
    border: 1px solid #1e2040;
    border-radius: 12px;
    overflow: visible;
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
  }
  .card:hover {
    transform: translateY(-4px);
    border-color: var(--accent, #c9a227);
    box-shadow: 0 8px 30px rgba(0,0,0,0.5), 0 0 20px var(--glow, rgba(201,162,39,0.15));
  }
  .card:hover .card-tooltip { opacity: 1; visibility: visible; transform: translateY(0); pointer-events: auto; }
  .card-inner {
    border-radius: 12px;
    overflow: hidden;
  }
  .card-tooltip {
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%) translateY(8px);
    width: 340px;
    max-width: 90vw;
    background: #12103a;
    border: 1px solid var(--accent, #c9a227);
    border-radius: 10px;
    padding: 14px 16px;
    z-index: 150;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.2s, transform 0.2s, visibility 0.2s;
    pointer-events: none;
    box-shadow: 0 8px 30px rgba(0,0,0,0.7);
    margin-bottom: 10px;
  }
  .card-tooltip::after {
    content: '';
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    border: 8px solid transparent;
    border-top-color: var(--accent, #c9a227);
  }
  .tt-name { font-family: 'Cinzel', serif; font-size: 15px; color: #f0e6d3; font-weight: 700; margin-bottom: 2px; }
  .tt-title { font-size: 11px; color: var(--accent, #c9a227); margin-bottom: 8px; }
  .tt-stats { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
  .tt-stat { background: #06061a; border: 1px solid #1e2040; border-radius: 5px; padding: 3px 7px; font-size: 10px; color: #9098b8; }
  .tt-stat strong { color: var(--accent, #c9a227); }
  .tt-abilities { display: flex; gap: 4px; margin-bottom: 8px; }
  .tt-ab { text-align: center; font-size: 10px; color: #9098b8; flex: 1; }
  .tt-ab span { display: block; font-size: 14px; font-weight: 700; color: #f0e6d3; }
  .tt-ab.hl span { color: var(--accent, #c9a227); }
  .tt-lore { font-size: 11px; color: #7a82a0; font-style: italic; line-height: 1.4; }
  .card-accent {
    height: 4px;
    background: var(--accent, #c9a227);
  }
  .card-body { padding: 20px; }
  .card-name {
    font-family: 'Cinzel', serif;
    font-size: 20px;
    font-weight: 700;
    color: #f0e6d3;
    margin-bottom: 4px;
  }
  .card-title {
    font-size: 12px;
    color: var(--accent, #c9a227);
    font-weight: 500;
    margin-bottom: 10px;
    letter-spacing: 0.5px;
  }
  .card-subtitle {
    font-size: 11px;
    color: #4a5272;
    margin-bottom: 12px;
    line-height: 1.4;
  }
  .card-stats {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .mini-stat {
    background: #06061a;
    border: 1px solid #1e2040;
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 11px;
    color: #9098b8;
  }
  .mini-stat strong { color: var(--accent, #c9a227); }
  .card-quote {
    font-size: 12px;
    font-style: italic;
    color: var(--accent, #c9a227);
    opacity: 0.8;
    line-height: 1.5;
    border-left: 2px solid var(--accent, #c9a227);
    padding-left: 10px;
  }
  .card-group {
    position: absolute;
    top: 14px;
    right: 14px;
    background: rgba(6,6,26,0.8);
    border: 1px solid #333;
    border-radius: 12px;
    padding: 3px 10px;
    font-size: 10px;
    color: #9098b8;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  /* ── Modal ── */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.9);
    z-index: 200;
    justify-content: center;
    align-items: flex-start;
    padding: 0;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: #08081a;
    width: 100%;
    height: 100vh;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .modal-header {
    padding: 10px 24px;
    border-bottom: 1px solid #1e2040;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #0a0a1e;
    z-index: 10;
    flex-shrink: 0;
  }
  .modal-header h2 {
    font-family: 'Cinzel', serif;
    color: #f0e6d3;
    font-size: 20px;
  }
  .modal-close {
    background: none;
    border: 1px solid #333;
    color: #9098b8;
    border-radius: 8px;
    padding: 6px 12px;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.2s;
  }
  .modal-close:hover { border-color: #cc3333; color: #cc3333; }
  .modal-nav {
    display: flex;
    gap: 8px;
  }
  .modal-nav button {
    background: #0e0e28;
    border: 1px solid #333;
    color: #c9a227;
    border-radius: 8px;
    padding: 6px 14px;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.2s;
  }
  .modal-nav button:hover { background: #c9a227; color: #06061a; }

  /* ── PDF Canvas Viewer ── */
  #modalPdf {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 0;
    gap: 16px;
    background: #06061a;
  }
  .pdf-page {
    position: relative;
    box-shadow: 0 4px 30px rgba(0,0,0,0.6);
    border: 1px solid #1e2040;
    border-radius: 4px;
    overflow: hidden;
  }
  .pdf-page canvas {
    display: block;
  }
  .text-layer {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    overflow: hidden;
  }
  .text-layer span {
    position: absolute;
    color: transparent;
    white-space: pre;
    cursor: default;
    line-height: 1;
  }
  .text-layer span.has-tooltip {
    cursor: help;
    border-radius: 3px;
    transition: background 0.15s;
  }
  .text-layer span.has-tooltip:hover {
    background: rgba(201, 162, 39, 0.25);
    color: transparent;
  }

  /* ── Tooltip ── */
  .spell-tooltip {
    display: none;
    position: fixed;
    z-index: 9999;
    max-width: 380px;
    background: #12103a;
    border: 1px solid #c9a227;
    border-radius: 10px;
    padding: 14px 16px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.8);
    pointer-events: none;
  }
  .spell-tooltip.visible { display: block; }
  .spell-tooltip .tt-spell-name {
    font-family: 'Cinzel', serif;
    font-size: 15px;
    color: #c9a227;
    font-weight: 700;
    margin-bottom: 2px;
  }
  .spell-tooltip .tt-spell-meta {
    font-size: 11px;
    color: #9098b8;
    margin-bottom: 8px;
    border-bottom: 1px solid #1e2040;
    padding-bottom: 6px;
  }
  .spell-tooltip .tt-spell-desc {
    font-size: 12px;
    color: #dce0f0;
    line-height: 1.5;
  }

  .pdf-loading {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 300px;
    color: #c9a227;
    font-family: 'Cinzel', serif;
    font-size: 16px;
  }
  .pdf-missing {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 300px;
    color: #4a5272;
    font-size: 14px;
    font-style: italic;
  }

  .keyboard-hint {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #0e0e28;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 11px;
    color: #4a5272;
    z-index: 50;
  }
  .keyboard-hint kbd {
    background: #1e2040;
    border: 1px solid #333;
    border-radius: 4px;
    padding: 2px 6px;
    font-size: 11px;
    color: #9098b8;
    font-family: monospace;
  }
</style>
</head>
<body>

<header>
  <h1>ADVENTURES OF <span>TIAMAT</span> — Character Browser</h1>
  <div class="header-stats">
    <div class="stat-badge"><strong id="totalCount">0</strong> Characters</div>
    <div class="stat-badge"><strong id="visibleCount">0</strong> Showing</div>
  </div>
</header>

<div class="toolbar">
  <input type="text" class="search-box" id="searchBox" placeholder="Search characters by name, title, or lore..." autofocus>
  <button class="filter-btn active" data-group="all" onclick="filterGroup('all', this)">All</button>
  <button class="filter-btn" data-group="royals" onclick="filterGroup('royals', this)">Royals</button>
  <button class="filter-btn" data-group="power" onclick="filterGroup('power', this)">Power Players</button>
  <button class="filter-btn" data-group="colorful" onclick="filterGroup('colorful', this)">Colorful NPCs</button>
  <button class="filter-btn" data-group="kubi" onclick="filterGroup('kubi', this)">Kubi Conspiracy</button>
  <button class="filter-btn" data-group="gondor" onclick="filterGroup('gondor', this)">Gondor</button>
  <button class="filter-btn" data-group="misc" onclick="filterGroup('misc', this)">Misc</button>
  <span style="color: #333; margin: 0 4px;">|</span>
  <button class="filter-btn theme-royal" data-theme="royal" onclick="filterTheme('royal', this)">Royal</button>
  <button class="filter-btn theme-warrior" data-theme="warrior" onclick="filterTheme('warrior', this)">Warrior</button>
  <button class="filter-btn theme-arcane" data-theme="arcane" onclick="filterTheme('arcane', this)">Arcane</button>
  <button class="filter-btn theme-shadow" data-theme="shadow" onclick="filterTheme('shadow', this)">Shadow</button>
  <button class="filter-btn theme-nature" data-theme="nature" onclick="filterTheme('nature', this)">Nature</button>
  <button class="filter-btn theme-fire" data-theme="fire" onclick="filterTheme('fire', this)">Fire</button>
  <button class="filter-btn theme-ocean" data-theme="ocean" onclick="filterTheme('ocean', this)">Ocean</button>
  <button class="filter-btn theme-orc" data-theme="orc" onclick="filterTheme('orc', this)">Orc</button>
  <button class="filter-btn theme-stone" data-theme="stone" onclick="filterTheme('stone', this)">Stone</button>
  <button class="filter-btn theme-pink" data-theme="pink" onclick="filterTheme('pink', this)">Pink</button>
</div>

<div class="grid" id="grid"></div>

<div class="modal-overlay" id="modal">
  <div class="modal" id="modalContent">
    <div class="modal-header">
      <h2 id="modalName"></h2>
      <div style="display:flex;gap:8px;align-items:center;">
        <div class="modal-nav">
          <button onclick="navChar(-1)">&#9664; Prev</button>
          <button onclick="navChar(1)">Next &#9654;</button>
        </div>
        <button class="modal-close" onclick="closeModal()">&#10005; Close</button>
      </div>
    </div>
    <div id="modalPdf"></div>
  </div>
</div>
<div class="spell-tooltip" id="spellTooltip">
  <div class="tt-spell-name" id="ttName"></div>
  <div class="tt-spell-meta" id="ttMeta"></div>
  <div class="tt-spell-desc" id="ttDesc"></div>
</div>

<div class="keyboard-hint">
  <kbd>&#8592;</kbd> <kbd>&#8594;</kbd> Navigate &nbsp; <kbd>Esc</kbd> Close &nbsp; <kbd>/</kbd> Search
</div>

<script>
const THEMES = {
  royal:   { accent: '#c9a227', glow: 'rgba(201,162,39,0.2)' },
  warrior: { accent: '#cc3333', glow: 'rgba(204,51,51,0.2)' },
  arcane:  { accent: '#4488ff', glow: 'rgba(68,136,255,0.2)' },
  nature:  { accent: '#44aa44', glow: 'rgba(68,170,68,0.2)' },
  shadow:  { accent: '#8844bb', glow: 'rgba(136,68,187,0.2)' },
  fire:    { accent: '#dd6622', glow: 'rgba(221,102,34,0.2)' },
  ocean:   { accent: '#2299bb', glow: 'rgba(34,153,187,0.2)' },
  stone:   { accent: '#aa8855', glow: 'rgba(170,136,85,0.2)' },
  orc:     { accent: '#88aa22', glow: 'rgba(136,170,34,0.2)' },
  pink:    { accent: '#dd4488', glow: 'rgba(221,68,136,0.2)' },
};

const CHARS = [
  // ROYALS
  { name:"Othorian Nel", title:"King · High Elf · Ancient Ruler", subtitle:"Born 10 B.T. · Age ~6,000 · Lawful Neutral", theme:"royal", group:"royals", cr:"21", hp:"285", ac:"20", quote:"I have watched empires rise and crumble. I will not let this one fall.", abilities:[["STR",18,"+4",0],["DEX",20,"+5",1],["CON",20,"+5",0],["INT",18,"+4",1],["WIS",22,"+6",1],["CHA",20,"+5",1]], traits:["Legendary Resistance (3/Day)","Ageless — cannot age","Tiamat's Secret — knows the reincarnation cycle","Elven Perfection — immune to charm/sleep","Battle-Hardened Commander — allies +2 attacks/saves within 30 ft."], lore:"The oldest living elf, born before the calendar. Has ruled for millennia, fought Jarnath multiple times, destroyed the town of Nether. Carries the terrible secret of Tiamat's reincarnation." },
  { name:"Charles Rex", title:"King · Human · Co-Ruler", subtitle:"Born 5948 A.T. · Secretly Being Poisoned · Lawful Good", theme:"royal", group:"royals", cr:"12", hp:"136", ac:"18", quote:"A king who cannot protect his family cannot protect his kingdom.", abilities:[["STR",18,"+4",1],["DEX",12,"+1",0],["CON",18,"+4",1],["INT",14,"+2",0],["WIS",16,"+3",1],["CHA",18,"+4",1]], traits:["Poisoned King — secretly being poisoned by Barfolomew","Beloved Ruler — advantage on Persuasion with citizens","Iron Will — advantage vs. fear/charm","Warrior King — still trains daily despite illness"], lore:"Rules alongside Othorian in an unprecedented alliance. A good man, loving father, slowly dying from poison he doesn't know about." },
  { name:"Marta Rex", title:"Queen · High Cleric · Healer", subtitle:"Born 5956 A.T. · Devoted Wife & Mother · Lawful Good", theme:"pink", group:"royals", cr:"9", hp:"102", ac:"16", quote:"Healing is not just mending flesh. It is mending hope.", abilities:[["STR",10,"+0",0],["DEX",12,"+1",0],["CON",16,"+3",0],["INT",14,"+2",0],["WIS",20,"+5",1],["CHA",18,"+4",1]], traits:["Divine Healer — max healing + damage resistance","Mother's Intuition — senses something wrong with Charles","Beacon of Hope — allies advantage on death saves"], lore:"The beating heart of the royal family. Channels divine magic into Charles daily, fighting an enemy she cannot see." },
  { name:"Amare Rex", title:"Princess · Cleric Apprentice", subtitle:"Born 5988 A.T. · Young & Rebellious · Neutral Good", theme:"pink", group:"royals", cr:"3", hp:"45", ac:"14", quote:"I don't want to be queen. I want to be useful.", abilities:[["STR",10,"+0",0],["DEX",14,"+2",0],["CON",14,"+2",0],["INT",13,"+1",0],["WIS",16,"+3",1],["CHA",16,"+3",1]], traits:["Emerging Gift — can upcast healing once/day","Rebellious Spirit — advantage vs. command","Father's Daughter — reactive healing when ally drops"], lore:"Youngest Rex child, following her mother's path. Headstrong, sharp-tongued, secretly terrified of losing her father." },
  { name:"Shilo Nel", title:"Prince · High Elf · Supremacist", subtitle:"Born 5345 A.T. · Age ~650 · Lawful Evil", theme:"shadow", group:"royals", cr:"14", hp:"168", ac:"18", quote:"Patience is the sharpest blade. I have centuries to wield it.", abilities:[["STR",14,"+2",0],["DEX",20,"+5",1],["CON",16,"+3",0],["INT",20,"+5",1],["WIS",16,"+3",1],["CHA",18,"+4",1]], traits:["Master Manipulator — advantage on Deception/Persuasion","Elven Supremacist — believes humans are inferior","Patient Evil — never acts impulsively","Shadow Magic — Darkness, Invisibility, Modify Memory at will"], lore:"Othorian's son. Brilliant, charming, utterly convinced elves are superior. Building networks of influence, waiting for the right moment." },
  // POWER PLAYERS
  { name:"Jarnath", title:"Dragon Slayer · Folk Hero · Legend", subtitle:"Born 1679 A.T. · Age ~4,300 · Chaotic Good", theme:"warrior", group:"power", cr:"20", hp:"262", ac:"19", quote:"I've fought gods, slept with worse, and I still can't pay my bar tab.", abilities:[["STR",24,"+7",1],["DEX",18,"+4",1],["CON",20,"+5",1],["INT",12,"+1",0],["WIS",14,"+2",0],["CHA",20,"+5",1]], traits:["Legendary Dragon Slayer — +3d6 vs. dragons","Unkillable Bastard — CON save to survive at 0 HP","Folk Hero's Luck — one reroll per turn","Kicked Out of Every Bar","Massive Gambling Debts"], lore:"Part Aragorn, part Han Solo, part All Might. Slain more dragons than anyone, fought Othorian multiple times, slept with Cthulhu's daughter." },
  { name:"Dorinar", title:"High Wizard · Tiamat Academy", subtitle:"Born 5810 A.T. · Keeper of Secrets · Lawful Neutral", theme:"arcane", group:"power", cr:"13", hp:"120", ac:"15", quote:"Knowledge without wisdom is a loaded crossbow in a child's hands.", abilities:[["STR",10,"+0",0],["DEX",14,"+2",0],["CON",18,"+4",1],["INT",22,"+6",1],["WIS",18,"+4",1],["CHA",14,"+2",0]], traits:["Knows Sileisil's dark pact","Arcane Mastery — free 5th-level cast","Spell Sculptor — exclude allies from AoE","Watchful Eye — advantage on checks in Academy"], lore:"Knows Sileisil's terrible secret and chose to watch rather than act. Carries this burden quietly." },
  { name:"Sileisil", title:"Academy President · Pact-Bound", subtitle:"Born 5800 A.T. · Secret Pact with Tiamat · Neutral", theme:"shadow", group:"power", cr:"16", hp:"152", ac:"17", quote:"The price of power is knowing you will pay it forever.", abilities:[["STR",10,"+0",0],["DEX",14,"+2",0],["CON",20,"+5",1],["INT",24,"+7",1],["WIS",18,"+4",1],["CHA",20,"+5",1]], traits:["Tiamat's Pact — tremendous power at a cost","Life Weaver — animate/resurrect at will","Blight Fighter — double damage to Blight","Prodigy's Mind — concentrate on 2 spells"], lore:"Most gifted wizard of her generation. Her power comes from a dark pact with Tiamat. Can force life into dead things." },
  { name:"King Grudge", title:"Orc King · Hellbringer · Warlord", subtitle:"Born 5960 A.T. · Building Army of 1,000 · Chaotic Evil", theme:"orc", group:"power", cr:"17", hp:"230", ac:"20", quote:"Humans build walls. I build armies. Walls fall. Armies don't.", abilities:[["STR",26,"+8",1],["DEX",14,"+2",0],["CON",22,"+6",1],["INT",12,"+1",0],["WIS",14,"+2",0],["CHA",20,"+5",1]], traits:["Hellbringer Legacy — +2d6 fire melee","Army of a Thousand — growing force","Relentless Endurance","Aggressive — bonus action charge","Siege Commander"], lore:"United scattered orc tribes under one banner through sheer strength. Building the largest orc force in centuries." },

// Remove duplicate Maurice
const seen = new Set();
const UNIQUE_CHARS = CHARS.filter(c => {
  const key = c.name + c.group;
  if (c.lore && c.lore.includes('Listed under')) return false;
  if (seen.has(c.name)) return false;
  seen.add(c.name);
  return true;
});

let currentFilter = 'all';
let currentTheme = null;
let currentSearch = '';
let currentModalIdx = -1;
let filteredChars = [...UNIQUE_CHARS];

function getTheme(t) { return THEMES[t] || THEMES.royal; }

function renderGrid() {
  filteredChars = UNIQUE_CHARS.filter(c => {
    const matchGroup = currentFilter === 'all' || c.group === currentFilter;
    const matchTheme = !currentTheme || c.theme === currentTheme;
    const matchSearch = !currentSearch ||
      c.name.toLowerCase().includes(currentSearch) ||
      c.title.toLowerCase().includes(currentSearch) ||
      (c.lore && c.lore.toLowerCase().includes(currentSearch)) ||
      (c.quote && c.quote.toLowerCase().includes(currentSearch));
    return matchGroup && matchTheme && matchSearch;
  });

  const grid = document.getElementById('grid');
  grid.innerHTML = filteredChars.map((c, i) => {
    const t = getTheme(c.theme);
    const abHtml = c.abilities.map(([n,s,m,hl]) =>
      `<div class="tt-ab${hl?' hl':''}"><span>${s}</span>${n}</div>`
    ).join('');
    const traitHtml = (c.traits||[]).slice(0,4).map(tr => `<div style="font-size:10px;color:#b8c0d8;margin-bottom:2px;">• ${tr}</div>`).join('');
    const loreSnip = c.lore ? (c.lore.length > 120 ? c.lore.slice(0,120) + '…' : c.lore) : '';
    return `<div class="card" style="--accent:${t.accent};--glow:${t.glow}" onclick="openModal(${i})">
      <div class="card-tooltip" style="--accent:${t.accent}">
        <div class="tt-name">${c.name}</div>
        <div class="tt-title">${c.title}</div>
        <div class="tt-stats">
          <div class="tt-stat"><strong>CR</strong> ${c.cr}</div>
          <div class="tt-stat"><strong>HP</strong> ${c.hp}</div>
          <div class="tt-stat"><strong>AC</strong> ${c.ac}</div>
        </div>
        <div class="tt-abilities">${abHtml}</div>
        ${traitHtml}
        ${loreSnip ? `<div class="tt-lore">${loreSnip}</div>` : ''}
      </div>
      <div class="card-inner">
        <div class="card-accent"></div>
        <div class="card-body">
          <div class="card-group">${c.group}</div>
          <div class="card-name">${c.name}</div>
          <div class="card-title">${c.title}</div>
          <div class="card-subtitle">${c.subtitle}</div>
          <div class="card-stats">
            <div class="mini-stat"><strong>CR</strong> ${c.cr}</div>
            <div class="mini-stat"><strong>HP</strong> ${c.hp}</div>
            <div class="mini-stat"><strong>AC</strong> ${c.ac}</div>
          </div>
          ${c.quote ? `<div class="card-quote">"${c.quote}"</div>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');

  document.getElementById('totalCount').textContent = UNIQUE_CHARS.length;
  document.getElementById('visibleCount').textContent = filteredChars.length;
}

function filterGroup(group, btn) {
  currentFilter = group;
  currentTheme = null;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderGrid();
}

function filterTheme(theme, btn) {
  currentFilter = 'all';
  if (currentTheme === theme) {
    currentTheme = null;
    btn.classList.remove('active');
  } else {
    currentTheme = theme;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }
  document.querySelector('[data-group="all"]').classList.toggle('active', !currentTheme);
  renderGrid();
}

// Build a sorted list of keys (longest first for matching priority)
const DND_KEYS = Object.keys(DND_DB).sort((a, b) => b.length - a.length);

function findTooltipMatch(text) {
  const lower = text.toLowerCase().trim()
    .replace(/^[•\-–—]\s*/, '')       // strip bullet prefixes
    .replace(/\s*[—–\-:].+$/, '');     // strip description after dash/colon
  if (lower.length < 3) return null;
  for (const key of DND_KEYS) {
    if (lower === key || lower.startsWith(key + ' ') || lower.startsWith(key + ',') || lower.startsWith(key + '.')) {
      const entry = DND_DB[key];
      return { name: key.replace(/\b\w/g, c => c.toUpperCase()), ...entry };
    }
  }
  // Also check if the entire text exactly matches
  for (const key of DND_KEYS) {
    if (lower.includes(key) && key.length >= 4) {
      const entry = DND_DB[key];
      return { name: key.replace(/\b\w/g, c => c.toUpperCase()), ...entry };
    }
  }
  return null;
}

// ── Matrix math helper ──
function transformPoint(m1, m2) {
  return [
    m1[0]*m2[0] + m1[2]*m2[1],
    m1[1]*m2[0] + m1[3]*m2[1],
    m1[0]*m2[2] + m1[2]*m2[3],
    m1[1]*m2[2] + m1[3]*m2[3],
    m1[0]*m2[4] + m1[2]*m2[5] + m1[4],
    m1[1]*m2[4] + m1[3]*m2[5] + m1[5]
  ];
}

// ── PDF Rendering ──
async function renderPdf(pdfName, container) {
  container.innerHTML = '<div class="pdf-loading">Loading character sheet...</div>';
  try {
    const pdf = await pdfjsLib.getDocument(pdfName).promise;
    container.innerHTML = '';

    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const baseViewport = page.getViewport({ scale: 1 });
      const scale = Math.min((container.clientWidth - 40) / baseViewport.width, 2.0);
      const viewport = page.getViewport({ scale });

      // Page container
      const pageDiv = document.createElement('div');
      pageDiv.className = 'pdf-page';
      pageDiv.style.width = viewport.width + 'px';
      pageDiv.style.height = viewport.height + 'px';

      // Canvas
      const canvas = document.createElement('canvas');
      canvas.width = viewport.width * (window.devicePixelRatio || 1);
      canvas.height = viewport.height * (window.devicePixelRatio || 1);
      canvas.style.width = viewport.width + 'px';
      canvas.style.height = viewport.height + 'px';
      const ctx = canvas.getContext('2d');
      ctx.scale(window.devicePixelRatio || 1, window.devicePixelRatio || 1);
      await page.render({ canvasContext: ctx, viewport }).promise;
      pageDiv.appendChild(canvas);

      // Text layer
      const textContent = await page.getTextContent();
      const textLayer = document.createElement('div');
      textLayer.className = 'text-layer';

      for (const item of textContent.items) {
        if (!item.str || !item.str.trim()) continue;

        const tx = transformPoint(viewport.transform, item.transform);
        const fontSize = Math.sqrt(tx[0]*tx[0] + tx[1]*tx[1]);
        const x = tx[4];
        const y = tx[5] - fontSize;

        const span = document.createElement('span');
        span.style.left = x + 'px';
        span.style.top = y + 'px';
        span.style.fontSize = fontSize + 'px';
        span.style.height = (fontSize * 1.2) + 'px';
        if (item.width) {
          span.style.width = (item.width * scale) + 'px';
        }
        span.textContent = item.str;

        // Check for tooltip match
        const match = findTooltipMatch(item.str);
        if (match) {
          span.classList.add('has-tooltip');
          span.dataset.ttName = match.name;
          span.dataset.ttLevel = match.level;
          span.dataset.ttSchool = match.school || '';
          span.dataset.ttTime = match.time || '';
          span.dataset.ttRange = match.range || '';
          span.dataset.ttDesc = match.desc;
        }

        textLayer.appendChild(span);
      }

      pageDiv.appendChild(textLayer);
      container.appendChild(pageDiv);
    }
  } catch(err) {
    container.innerHTML = '<div class="pdf-missing">No character sheet found.</div>';
    console.error('PDF load error:', err);
  }
}

// ── Tooltip Hover ──
const tooltipEl = document.getElementById('spellTooltip');
document.addEventListener('mouseover', (e) => {
  const span = e.target.closest('.has-tooltip');
  if (!span) return;
  const meta = [];
  if (span.dataset.ttLevel) meta.push(span.dataset.ttLevel);
  if (span.dataset.ttSchool) meta.push(span.dataset.ttSchool);
  if (span.dataset.ttTime) meta.push('Cast: ' + span.dataset.ttTime);
  if (span.dataset.ttRange) meta.push('Range: ' + span.dataset.ttRange);
  document.getElementById('ttName').textContent = span.dataset.ttName;
  document.getElementById('ttMeta').textContent = meta.join('  ·  ');
  document.getElementById('ttDesc').textContent = span.dataset.ttDesc;
  tooltipEl.classList.add('visible');

  const rect = span.getBoundingClientRect();
  let left = rect.left + rect.width / 2 - 190;
  let top = rect.top - 10;
  // Position above span
  tooltipEl.style.left = Math.max(8, Math.min(left, window.innerWidth - 400)) + 'px';
  tooltipEl.style.top = 'auto';
  tooltipEl.style.bottom = (window.innerHeight - top) + 'px';
});
document.addEventListener('mouseout', (e) => {
  if (e.target.closest && e.target.closest('.has-tooltip')) {
    tooltipEl.classList.remove('visible');
  }
});

// ── Modal ──
async function openModal(idx) {
  currentModalIdx = idx;
  const c = filteredChars[idx];
  const t = getTheme(c.theme);
  document.getElementById('modalName').textContent = c.name;
  document.getElementById('modalContent').style.setProperty('--accent', t.accent);
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow = 'hidden';

  const pdfName = c.name.replace(/\s+/g, '_') + '_Character_Sheet.pdf';
  await renderPdf(pdfName, document.getElementById('modalPdf'));
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  document.getElementById('modalPdf').innerHTML = '';
  document.body.style.overflow = '';
  currentModalIdx = -1;
}

function navChar(dir) {
  if (currentModalIdx < 0) return;
  let next = currentModalIdx + dir;
  if (next < 0) next = filteredChars.length - 1;
  if (next >= filteredChars.length) next = 0;
  openModal(next);
}

document.getElementById('searchBox').addEventListener('input', (e) => {
  currentSearch = e.target.value.toLowerCase().trim();
  renderGrid();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
  if (e.key === 'ArrowLeft' && currentModalIdx >= 0) navChar(-1);
  if (e.key === 'ArrowRight' && currentModalIdx >= 0) navChar(1);
  if (e.key === '/' && currentModalIdx < 0 && document.activeElement !== document.getElementById('searchBox')) {
    e.preventDefault();
    document.getElementById('searchBox').focus();
  }
});

document.getElementById('modal').addEventListener('click', (e) => {
  if (e.target === document.getElementById('modal')) closeModal();
});

renderGrid();
